<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "gs_data.json", function (data) {
            var totalCitation = data['citedby']
            document.getElementById('total_cit').innerHTML = totalCitation;
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var numCitations = data['publications'][paperId]['num_citations']
                element.innerHTML = '| 引用数: ' + numCitations;
            });
            
            // 处理 GitHub 星标
            var repoEles = document.getElementsByClassName('show_github_stars')
            Array.prototype.forEach.call(repoEles, element => {
                var repoName = element.getAttribute('data')
                if (data['github_repos'] && data['github_repos'][repoName]) {
                    var stars = data['github_repos'][repoName]['stars']
                    element.innerHTML = '★' + stars;
                }
            });
        });
    })
</script>
